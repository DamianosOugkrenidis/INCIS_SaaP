name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: 'INCIS_SaaP.sln'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        # SQL readiness handled by the 'Wait for SQL Server' step (avoids secrets/quoting in options)

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Wait for SQL Server
      run: |
        for i in $(seq 1 30); do
          if (echo > /dev/tcp/localhost/1433) 2>/dev/null; then echo "SQL ready"; exit 0; fi
          echo "waiting for SQL... $i"; sleep 2
        done
        echo "SQL did not start"; exit 1

    - name: Restore dependencies
      run: dotnet restore INCIS_SaaP.Tests/INCIS_SaaP.Tests.csproj

    - name: Build (app + tests)
      run: dotnet build INCIS_SaaP.Tests/INCIS_SaaP.Tests.csproj --configuration Release --no-restore

    - name: Run all tests (unit + integration + functional + regression + security)
      run: >
        dotnet test INCIS_SaaP.Tests/INCIS_SaaP.Tests.csproj
        --configuration Release --no-build --verbosity normal
        --collect:"XPlat Code Coverage"
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ./coverage
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=INCIS_SaaP_Test;User Id=SA;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;"
        INCIS_TEST_SQL_CONNECTION: "Server=localhost;Database=master;User Id=SA;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;"
        Jwt__Secret: "${{ secrets.CI_JWT_SECRET }}"
        AdminSeed__Email: "test@ci.local"
        AdminSeed__Password: "${{ secrets.CI_ADMIN_SEED_PASSWORD }}"

    - name: Enforce minimum line coverage (>= 70%)
      if: always()
      shell: pwsh
      run: |
        $xml = Get-ChildItem ./coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
        if (-not $xml) { Write-Error "coverage.cobertura.xml not found"; exit 1 }
        [xml]$c = Get-Content -LiteralPath $xml.FullName -Raw
        $rate = [double]$c.coverage.'line-rate'
        Write-Host ("Line coverage: {0:P2}" -f $rate)
        if ($rate -lt 0.70) { Write-Error ("Line coverage {0:P2} < 70%" -f $rate); exit 1 }

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ./coverage

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install security scanner
      run: dotnet tool install --global security-scan

    - name: Run security scan
      run: security-scan ${{ env.SOLUTION_FILE }}
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -f INCIS_SaaP/Dockerfile -t incis-saap:${{ github.sha }} .
        docker build -f INCIS_SaaP/Dockerfile -t incis-saap:latest .

    - name: Run Docker health check
      run: |
        docker run -d --name incis-test \
          -e ConnectionStrings__DefaultConnection="Server=host.docker.internal;Database=INCIS_Test;User Id=SA;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;" \
          -e Jwt__Secret="${{ secrets.CI_JWT_SECRET }}" \
          -e AdminSeed__Password="${{ secrets.CI_ADMIN_SEED_PASSWORD }}" \
          -p 8080:8080 \
          incis-saap:latest || true
        sleep 10
        docker logs incis-test || true
        docker stop incis-test || true
        docker rm incis-test || true

  playwright-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        # SQL readiness handled by the 'Wait for SQL Server' step (avoids secrets/quoting in options)

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Wait for SQL Server
      run: |
        for i in $(seq 1 30); do
          if (echo > /dev/tcp/localhost/1433) 2>/dev/null; then echo "SQL ready"; exit 0; fi
          echo "waiting for SQL... $i"; sleep 2
        done
        echo "SQL did not start"; exit 1

    - name: Build Playwright test project
      run: dotnet build INCIS_SaaP.PlaywrightTests/INCIS_SaaP.PlaywrightTests.csproj --configuration Debug

    - name: Install Chromium for Playwright
      run: pwsh INCIS_SaaP.PlaywrightTests/bin/Debug/net9.0/playwright.ps1 install chromium

    - name: Run Playwright (browser) tests
      run: dotnet test INCIS_SaaP.PlaywrightTests/INCIS_SaaP.PlaywrightTests.csproj --no-build --logger "trx;LogFileName=playwright.trx" --results-directory ./playwright-results
      env:
        INCIS_TEST_SQL_CONNECTION: "Server=localhost;Database=master;User Id=SA;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;"

    - name: Upload Playwright results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results
        path: ./playwright-results


